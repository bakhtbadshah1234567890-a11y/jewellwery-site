<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Soft subtle glow / backing for contrast -->
  <circle cx="32" cy="32" r="30" fill="#FAF8F5" stroke="#EDE8E1" stroke-width="1.5"/>

  <!-- Elegant Spencerian / Fine Jewellery G Monogram in deep wine burgundy -->
  <!-- Top entry flourish -->
  <path d="M28 20 C22 17 21 12 27 10 C33 9 40 11 44 14" 
        stroke="#68001e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Main majestic bowl of the G -->
  <path d="M44 14 C33 11 20 13 14 24 C8 35 10 47 18 53 C26 58 37 56 43 49 C47 44 48 37 47 30" 
        stroke="#68001e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Inward horizontal crossbar -->
  <path d="M47 30 L34 30" 
        stroke="#68001e" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Signature descender loop -->
  <path d="M47 30 C45 39 42 49 38 54 C34 59 29 57 29 52 C29 46 36 43 45 42" 
        stroke="#68001e" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Delicate 4-point diamond sparkle star at upper right -->
  <path d="M46 16 Q46 20 44 20 Q46 20 46 24 Q46 20 48 20 Q46 20 46 16 Z" 
        fill="#D6C2A1"/>
</svg>
